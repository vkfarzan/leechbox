<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | لیچ‌باکس</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"><style>
*{box-sizing:border-box}body{margin:0;background:#090e1a;color:#f5f7ff;font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#26335c 0,transparent 48%),radial-gradient(ellipse at 0% 100%,#102a31 0,transparent 35%);pointer-events:none}.shell{position:relative;width:min(430px,calc(100% - 36px));text-align:center}.brand{display:inline-flex;align-items:center;gap:10px;direction:ltr;font-weight:800;letter-spacing:.1px;font-size:20px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#8d82ff,#6251e7);box-shadow:0 8px 30px #7365fb50}.logo svg{width:23px}.card{text-align:right;background:#121a2b;border:1px solid #2a354b;border-radius:22px;padding:34px;margin:28px 0;box-shadow:0 28px 80px #0006}.tag{color:#a99cff;font-size:12px;font-weight:700}.card h1{font-size:25px;margin:10px 0 6px}.sub{color:#8997ae;font-size:13px;line-height:2;margin:0 0 26px}label{font-size:13px;font-weight:700;display:block;margin-bottom:9px}.field{display:flex;align-items:center;border:1px solid #38455f;border-radius:12px;background:#0b1322;padding:0 14px}.field:focus-within{border-color:#9185ff;box-shadow:0 0 0 3px #8378f222}.field input{background:transparent;color:#fff;border:0;outline:0;padding:15px 0;width:100%;font:inherit;direction:ltr}.show{color:#a5b0c3;background:none;border:0;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}.submit{font:inherit;font-weight:700;border:0;border-radius:12px;background:#8174f9;color:#fff;width:100%;padding:14px;margin-top:20px;cursor:pointer}.submit:hover{background:#9489ff}.foot{font-size:12px;color:#6f7d95}.safe{display:flex;align-items:center;gap:8px;margin-top:22px;font-size:12px;color:#7988a0}.dot{width:7px;height:7px;border-radius:50%;background:#66d6af}
</style></head><body><main class="shell"><div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3" stroke-linecap="round" stroke-linejoin="round"/></svg></span> LEECHBOX</div><div class="card"><div class="tag">پنل مدیریت شخصی</div><h1>خوش اومدی 👋</h1><p class="sub">برای مدیریت دانلودها و فایل‌هات، رمز ورود پنل رو وارد کن.</p><p id="error" style="display:none;color:#ff9ba7;font-size:12px;margin:-12px 0 18px">رمز عبور اشتباه است. دوباره تلاش کن.</p><form method="post"><label for="password">رمز عبور</label><div class="field"><input id="password" name="password" type="password" autocomplete="current-password" required autofocus placeholder="رمز عبور پنل"><button type="button" class="show" onclick="let p=document.getElementById('password');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'نمایش':'پنهان'">نمایش</button></div><button class="submit">ورود به داشبورد ←</button></form><div class="safe"><span class="dot"></span> اتصال امن به پنل مدیریت</div></div><div class="foot">فضای دانلود شخصی شما · LEECHBOX</div></main><script>if(new URLSearchParams(location.search).has("error"))document.getElementById("error").style.display="block";</script></body></html>
